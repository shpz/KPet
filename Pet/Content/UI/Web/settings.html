<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置</title>
<style>
  /* ============ 基础 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* 与 session-panel.html 共用同一套主题变量（三主题，变量名完全一致） */
  :root {
    /* ===== 主题变量（默认 dark-glass 深色玻璃，与会话面板默认一致） ===== */
    --bg: #14161e;
    --text-1: #eaf0fa;
    --text-1-active: #eef7ff;
    --panel-title: #e7edf8;
    --text-2: #8a94ac;
    --text-faint: #7c869e;
    --text-faint-active: #93b4cc;
    --text-hint: #565f74;

    --panel-bg: linear-gradient(180deg, #1b212e 0%, #161b27 100%);
    --panel-border: rgba(140, 170, 235, 0.16);
    --panel-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);

    --divider: rgba(255, 255, 255, 0.07);
    --pill-bg: rgba(255, 255, 255, 0.06);
    --pill-border: rgba(255, 255, 255, 0.10);
    --pill-text: #8a94ac;

    --hover-bg: rgba(255, 255, 255, 0.08);
    --hover-color: #eaf0fa;

    --row-bg: rgba(255, 255, 255, 0.03);
    --row-border: rgba(255, 255, 255, 0.06);
    --row-hover-bg: rgba(255, 255, 255, 0.06);
    --row-hover-border: rgba(255, 255, 255, 0.12);
    --row-active-bg: rgba(87, 214, 255, 0.10);
    --row-active-border: rgba(87, 214, 255, 0.26);

    /* 设置页的单选与分段按钮独立于会话行，始终保留可辨识的底板与描边。 */
    --control-bg: rgba(255, 255, 255, 0.03);
    --control-border: rgba(255, 255, 255, 0.10);
    --control-hover-bg: rgba(255, 255, 255, 0.08);
    --control-hover-border: rgba(255, 255, 255, 0.18);
    --control-active-bg: rgba(87, 214, 255, 0.10);
    --control-active-border: rgba(87, 214, 255, 0.34);

    --accent-bar: linear-gradient(180deg, #6be3ff 0%, #3fa9f5 100%);
    --accent-glow: rgba(87, 214, 255, 0.55);
    --accent-soft: rgba(87, 214, 255, 0.12);

    --busy: #57d6ff;
    --unread: rgba(255, 90, 110, 0.92);
    --unread-glow: rgba(255, 90, 110, 0.60);

    --scrollbar-color: rgba(255, 255, 255, 0.16);
    --scrollbar-thumb: rgba(255, 255, 255, 0.14);
    --scrollbar-thumb-hover: rgba(87, 214, 255, 0.45);

    --empty-border: rgba(255, 255, 255, 0.14);
    --empty-bg: rgba(255, 255, 255, 0.02);
    --empty-icon: #4a5268;
  }

  /* ===== 主题：浅色极简 ===== */
  body[data-theme="light-minimal"] {
    --bg: #eef3fa;
    --text-1: #20242e;
    --text-1-active: #2f5bc4;
    --panel-title: #20242e;
    --text-2: #5b6472;
    --text-faint: #98a2b3;
    --text-faint-active: #5b6472;
    --text-hint: #98a2b3;

    --panel-bg: #ffffff;
    --panel-border: rgba(15, 23, 42, 0.07);
    /* 色键透明窗口的外侧阴影只能以预乘色上屏（无法与桌面混合）且会成为残影来源，一律不用 */
    --panel-shadow: none;

    --divider: #eef1f5;
    --pill-bg: #f2f4f8;
    --pill-border: #eef1f5;
    --pill-text: #5b6472;

    --hover-bg: #e8effc;
    --hover-color: #2f5bc4;

    --row-bg: transparent;
    --row-border: transparent;
    --row-hover-bg: #f5f7fa;
    --row-hover-border: transparent;
    --row-active-bg: #eef4fe;
    --row-active-border: transparent;

    /* 会话行保持极简无边框；设置控件另用浅底与低对比描边，避免退化成纯文字。 */
    --control-bg: #f6f8fb;
    --control-border: #dce4ef;
    --control-hover-bg: #eef3fb;
    --control-hover-border: #b9cae6;
    --control-active-bg: #e8effc;
    --control-active-border: #8eace6;

    --accent-bar: linear-gradient(180deg, #3b6fe0 0%, #2f5bc4 100%);
    --accent-glow: rgba(59, 111, 224, 0.35);
    --accent-soft: #e8effc;

    --busy: #7c93cc;
    --unread: #e5484d;
    --unread-glow: rgba(229, 72, 77, 0.14);

    --scrollbar-color: #c9d1dd;
    --scrollbar-thumb: #c9d1dd;
    --scrollbar-thumb-hover: #aab6c8;

    --empty-border: rgba(15, 23, 42, 0.12);
    --empty-bg: #f6f8fb;
    --empty-icon: #93a5c1;
  }

  /* ===== 主题：可爱宠物风 ===== */
  body[data-theme="cute-pet"] {
    --bg: #fff6e8;
    --text-1: #4c382b;
    --text-1-active: #e56a3c;
    --panel-title: #4c382b;
    --text-2: #8a6a52;
    --text-faint: #c2a48c;
    --text-faint-active: #8a6a52;
    --text-hint: #c2a48c;

    --panel-bg: #fffdf7;
    --panel-border: rgba(196, 140, 88, 0.22);
    /* 同上：外侧阴影在色键透明窗口上无法正确呈现，禁用 */
    --panel-shadow: none;

    --divider: #f6e8d8;
    --pill-bg: #fde9d6;
    --pill-border: #f6d3b4;
    --pill-text: #d96b33;

    --hover-bg: #fde9d6;
    --hover-color: #e56a3c;

    --row-bg: transparent;
    --row-border: transparent;
    --row-hover-bg: #fff5e8;
    --row-hover-border: transparent;
    --row-active-bg: rgba(245, 130, 79, 0.10);
    --row-active-border: transparent;

    /* 会话行保持轻盈；设置控件采用暖白底与杏色描边，保留按钮边界。 */
    --control-bg: #fff8ef;
    --control-border: #efd5ba;
    --control-hover-bg: #fff0de;
    --control-hover-border: #eab98f;
    --control-active-bg: #fde9d6;
    --control-active-border: #eea16d;

    --accent-bar: linear-gradient(180deg, #f5824f 0%, #ffb37e 100%);
    --accent-glow: rgba(245, 130, 79, 0.40);
    --accent-soft: #fde9d6;

    --busy: #f79a4e;
    --unread: #e6533f;
    --unread-glow: rgba(230, 83, 63, 0.16);

    --scrollbar-color: #e6c9a8;
    --scrollbar-thumb: #e6c9a8;
    --scrollbar-thumb-hover: #d8b28c;

    --empty-border: rgba(196, 140, 88, 0.22);
    --empty-bg: #fff5e8;
    --empty-icon: #d99b5f;
  }

  html, body { height: 100%; background: transparent; }

  /* 设置页与 Slate 客户区同尺寸；透明只用于四个圆角，Win 端另有原生窗口区域裁剪兜底 */
  body {
    background: transparent;
    color: var(--text-1);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 点击关闭按钮后本地隐藏（无动画）；实际关闭由 C++ 控制 */
  body.is-hidden { display: none; }

  /* ============ 设置卡片 ============ */
  .settings-card {
    width: 100%;
    height: 100%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    box-shadow: var(--panel-shadow);
    overflow: hidden;
  }

  .settings-header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 10px 12px 16px;
    border-bottom: 1px solid var(--divider);
  }
  .settings-title { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--panel-title); }

  /* 关闭按钮（×）：只向 C++ 发请求，实际关闭由 C++ 控制 */
  .btn-close {
    appearance: none;
    margin-left: auto;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .btn-close:hover { background: var(--hover-bg); color: var(--hover-color); }
  .btn-close:active { transform: translateY(1px); }

  /* ============ 设置项 ============ */
  .settings-body {
    flex: 1;
    min-height: 0;
    padding: 8px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-y: auto;
    /* 选择 Web 后会展示地址提示；内容超高时沿用会话面板的细滚动条。 */
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-color) transparent;
  }
  .settings-body::-webkit-scrollbar { width: 6px; }
  .settings-body::-webkit-scrollbar-track { background: transparent; }
  .settings-body::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 3px;
  }
  .settings-body::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field-label { font-size: 12px; font-weight: 600; letter-spacing: .5px; color: var(--text-2); }

  /* 单选选项（打开会话方式） */
  .radio-group { display: flex; gap: 8px; }
  .radio-option { flex: 1; }
  .radio-option input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .radio-option span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--control-border);
    background: var(--control-bg);
    color: var(--text-1);
    font-size: 12px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .radio-option span:hover {
    background: var(--control-hover-bg);
    border-color: var(--control-hover-border);
    color: var(--text-1-active);
  }
  .radio-option input:checked + span {
    background: var(--control-active-bg);
    border-color: var(--control-active-border);
    color: var(--text-1-active);
    font-weight: 600;
  }
  .radio-option input:focus-visible + span { outline: 1px solid var(--accent-glow); }

  /* kimi web 地址只读提示 */
  .uri-hint {
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text-faint);
    word-break: break-all;
  }
  .uri-hint[hidden] { display: none; }

  /* 分段控件（面板主题） */
  .segment-group { display: flex; gap: 8px; }
  .segment { flex: 1; }
  .segment button {
    appearance: none;
    width: 100%;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--control-border);
    border-radius: 8px;
    background: var(--control-bg);
    color: var(--text-1);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .segment button:hover {
    background: var(--control-hover-bg);
    border-color: var(--control-hover-border);
    color: var(--text-1-active);
  }
  .segment button.is-selected {
    background: var(--control-active-bg);
    border-color: var(--control-active-border);
    color: var(--text-1-active);
    font-weight: 600;
  }
  .segment button:focus-visible { outline: 1px solid var(--accent-glow); }

  /* 开关（显示帧率） */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .toggle-row .field-label { margin: 0; }
  .switch {
    position: relative;
    flex: none;
    width: 40px;
    height: 22px;
  }
  .switch input {
    appearance: none;
    -webkit-appearance: none;
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  .switch .track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--control-border);
    border: 1px solid var(--control-border);
    transition: background .15s ease, border-color .15s ease;
  }
  .switch .knob {
    position: absolute;
    top: 50%;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--text-2);
    transform: translateY(-50%);
    transition: transform .15s ease, background .15s ease;
  }
  .switch input:checked + .track { background: var(--busy); border-color: var(--busy); }
  .switch input:checked ~ .knob { transform: translate(18px, -50%); background: var(--panel-bg); }
  .switch input:focus-visible + .track { outline: 1px solid var(--accent-glow); }

  [hidden] { display: none !important; }

  /* 动效尊重系统设置 */
  @media (prefers-reduced-motion: reduce) {
    .switch .knob, .radio-option span, .segment button { transition: none; }
  }
</style>
</head>
<body>

  <!-- 设置卡片：半透明圆角卡片风格，尺寸跟随窗口视口 -->
  <section class="settings-card" aria-label="设置">
    <header class="settings-header">
      <span class="settings-title">设置</span>
      <button class="btn-close" id="btnClose" type="button" aria-label="关闭设置" title="关闭设置">×</button>
    </header>

    <div class="settings-body">
      <!-- ① 打开会话方式 -->
      <div class="field">
        <span class="field-label" id="openTargetLabel">打开会话方式</span>
        <div class="radio-group" role="radiogroup" aria-labelledby="openTargetLabel">
          <label class="radio-option">
            <input type="radio" name="openTarget" value="cli" checked>
            <span>CLI</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="openTarget" value="web">
            <span>Web</span>
          </label>
        </div>
        <p class="uri-hint" id="uriHint" hidden></p>
      </div>

      <!-- ② 面板主题 -->
      <div class="field">
        <span class="field-label" id="themeLabel">面板主题</span>
        <div class="segment-group" role="group" aria-labelledby="themeLabel">
          <span class="segment"><button type="button" data-theme-id="dark-glass">深色玻璃</button></span>
          <span class="segment"><button type="button" data-theme-id="light-minimal">浅色极简</button></span>
          <span class="segment"><button type="button" data-theme-id="cute-pet">可爱宠物</button></span>
        </div>
      </div>

      <!-- ③ 显示帧率 -->
      <div class="field">
        <div class="toggle-row">
          <span class="field-label" id="fpsLabel">显示帧率</span>
          <label class="switch" aria-label="显示帧率">
            <input type="checkbox" id="fpsSwitch">
            <span class="track"></span>
            <span class="knob"></span>
          </label>
        </div>
      </div>
    </div>
  </section>

<script>
'use strict';

/* ================================================================
 * 设置页脚本（供 UE5 WebBrowser LoadString 加载）
 *
 * 对外契约：window.KimiPetSettings
 *   applySettings(s)   刷新控件状态并应用主题
 *                       s = { open_target:'cli'|'web',
 *                             open_web_url:string,
 *                             ui_theme:themeId,
 *                             fps_monitor:boolean }
 *
 * JS→C++ 回调：window.ue.petsettings（方法名小写、大小写不敏感查找）
 *   setopentarget('cli'|'web') / settheme(themeId)
 *   setfpsmonitor(bool) / closesettings() / reportfps(n)
 * 用户操作时乐观更新 UI 并立即回调；主题切换在本页即时预览生效。
 * ================================================================ */

/* ---------- 元素引用 ---------- */
const closeBtn   = document.getElementById('btnClose');
const targetInputs = document.querySelectorAll('input[name="openTarget"]');
const uriHintEl  = document.getElementById('uriHint');
const fpsSwitch  = document.getElementById('fpsSwitch');
const themeButtons = document.querySelectorAll('.segment button');

/* ---------- 主题清单：与会话面板共用同一套 themeId ---------- */
const THEME_IDS = ['dark-glass', 'light-minimal', 'cute-pet'];

/* ---------- 透明表面完整刷新 ---------- */
/* UE WebBrowser 的软件纹理首次可能只上传局部脏区。恢复显示后对整页做两帧轻量
 * 重绘，覆盖透明区的未初始化像素与旧画面。宿主预热期间整窗透明，用户看不到
 * 这里用于触发重绘的细微透明度变化。 */
let surfaceRefreshToken = 0;
function refreshSurface() {
  const token = ++surfaceRefreshToken;
  const root = document.documentElement;
  root.style.opacity = '';
  void root.offsetWidth;
  requestAnimationFrame(() => {
    if (token !== surfaceRefreshToken) return;
    root.style.opacity = '0.999';
    void root.offsetWidth;
    requestAnimationFrame(() => {
      if (token !== surfaceRefreshToken) return;
      root.style.opacity = '';
    });
  });
}

/* ---------- 当前状态（C++ 经 applySettings 推入，用户操作即时更新） ---------- */
const state = {
  openTarget: 'cli',
  openWebUrl: '',
  uiTheme: 'dark-glass',
  fpsMonitor: false
};

/* ---------- UE 桥调用 ---------- */
/* 探测 window.ue.petsettings；方法名按大小写不敏感方式查找（UE 绑定可能把
 * SetOpenTarget 暴露为 setopentarget）；桥不存在或方法缺失时仅告警、页面不崩。 */
function findBridgeMethod(bridge, name) {
  if (!bridge || typeof name !== 'string') return undefined;
  if (typeof bridge[name] === 'function') return bridge[name];
  const lower = name.toLowerCase();
  for (const key of Object.keys(bridge)) {
    if (key.toLowerCase() === lower && typeof bridge[key] === 'function') {
      return bridge[key];
    }
  }
  return undefined;
}

function callBridge(action, ...args) {
  try {
    const host = (typeof window !== 'undefined') ? window : undefined;
    const bridge = host && host.ue && host.ue.petsettings ? host.ue.petsettings : undefined;
    if (!bridge) {
      console.warn('[KimiPetSettings] UE 桥（window.ue.petsettings）不存在，忽略动作：' + action + '，参数：', args);
      return;
    }
    const fn = findBridgeMethod(bridge, action);
    if (typeof fn === 'function') {
      fn.apply(bridge, args);
    } else {
      console.warn('[KimiPetSettings] UE 桥未暴露方法：' + action);
    }
  } catch (err) {
    console.warn('[KimiPetSettings] 调用 UE 桥失败：', err);
  }
}

/* ---------- FPS 上报器 ---------- */
/* 与 session-panel.html 是同一段轻量脚本（各页内联一份）：requestAnimationFrame 计数，
 * 每满 1 秒经本页桥上报一次整数 fps；页面加载后不自动启动，由 applySettings 控制。 */
window.KimiPetFps = (function () {
  let running = false;
  let rafId = 0;
  let frames = 0;
  let baseTs = 0;

  function tick(now) {
    frames++;
    const elapsed = (now - baseTs) / 1000;
    if (elapsed >= 1) {
      callBridge('ReportFps', Math.round(frames / elapsed));
      frames = 0;
      baseTs = now;
    }
    if (running) rafId = requestAnimationFrame(tick);
  }

  return {
    start() {
      if (running) return;
      running = true;
      frames = 0;
      baseTs = performance.now();
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      frames = 0;
      baseTs = 0;
    }
  };
})();

/* ---------- 渲染控件 ---------- */
/* renderControls 权重高于 is-selected 类：radio/开关由真实 state 驱动 */
function renderControls() {
  targetInputs.forEach((input) => {
    input.checked = (input.value === state.openTarget);
  });

  /* 主题分段 + body[data-theme] 即时预览 */
  themeButtons.forEach((btn) => {
    btn.classList.toggle('is-selected', btn.dataset.themeId === state.uiTheme);
  });
  if (THEME_IDS.indexOf(state.uiTheme) !== -1) {
    document.body.dataset.theme = state.uiTheme;
  }

  /* Web 地址只读提示：仅选择 Web 时展示 */
  if (state.openTarget === 'web') {
    uriHintEl.textContent = 'Web 地址：' + (state.openWebUrl || '（未设置）');
    uriHintEl.hidden = false;
  } else {
    uriHintEl.textContent = '';
    uriHintEl.hidden = true;
  }

  fpsSwitch.checked = !!state.fpsMonitor;
}

/* ---------- 对外 API ---------- */
window.KimiPetSettings = {

  /* C++ 推入设置：刷新控件状态并应用主题（幂等；各字段按类型校验，非法值忽略） */
  applySettings(s) {
    if (!s || typeof s !== 'object') {
      console.warn('[KimiPetSettings] applySettings 期望对象入参，实际为：', s);
      return;
    }
    // 重开面板时解除「×」按钮留下的本地隐藏（对齐会话面板 showPanel 的做法）
    document.body.classList.remove('is-hidden');
    if (s.open_target === 'cli' || s.open_target === 'web') state.openTarget = s.open_target;
    if (typeof s.open_web_url === 'string') state.openWebUrl = s.open_web_url;
    if (THEME_IDS.indexOf(s.ui_theme) !== -1) state.uiTheme = s.ui_theme;
    if (typeof s.fps_monitor === 'boolean') {
      state.fpsMonitor = s.fps_monitor;
      // 帧率上报随设置启停：不自动启动，仅按 C++ 通知控制
      if (s.fps_monitor) {
        window.KimiPetFps.start();
      } else {
        window.KimiPetFps.stop();
      }
    }
    renderControls();
  },

  /* 面板从隐藏态恢复后调用；requestAnimationFrame 在 CEF 隐藏期间会自然等待 */
  refreshSurface() {
    refreshSurface();
  }
};

/* ---------- 用户交互：乐观更新 UI 并立即回调 ---------- */

/* 打开会话方式 */
targetInputs.forEach((input) => {
  input.addEventListener('change', () => {
    if (!input.checked) return;
    state.openTarget = input.value;
    renderControls();
    callBridge('SetOpenTarget', input.value);
  });
});

/* 面板主题：本页即时预览 + 回传 themeId */
themeButtons.forEach((btn) => {
  btn.addEventListener('click', () => {
    const themeId = btn.dataset.themeId;
    if (THEME_IDS.indexOf(themeId) === -1) return;
    state.uiTheme = themeId;
    renderControls();
    callBridge('SetTheme', themeId);
  });
});

/* 显示帧率 */
fpsSwitch.addEventListener('change', () => {
  state.fpsMonitor = fpsSwitch.checked;
  if (state.fpsMonitor) {
    window.KimiPetFps.start();
  } else {
    window.KimiPetFps.stop();
  }
  callBridge('SetFpsMonitor', state.fpsMonitor);
});

/* 关闭：仅本地隐藏 + 发请求，实际关闭由 C++ 控制 */
closeBtn.addEventListener('click', () => {
  document.body.classList.add('is-hidden');
  callBridge('CloseSettings');
});

/* ---------- 初始渲染（默认 dark-glass；状态由 C++ 后续同步） ---------- */
renderControls();
</script>
</body>
</html>
