<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会话面板</title>
<style>
  /* ============ 基础 ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* 行高 = 行内容 56px + 行间距 4px；列表最多显示 8 行（不写死像素） */
    --row-h: 60px;
    --row-limit: 8;

    /* ===== 主题变量（默认 dark-glass 深色玻璃：与既有配色一致） ===== */
    /* 页面透明区的后备色；实体颜色只由面板卡片绘制 */
    --bg: #14161e;

    /* 文字层级 */
    --text-1: #eaf0fa;            /* 主文字（行标题等） */
    --text-1-active: #eef7ff;     /* 激活行标题（更亮） */
    --panel-title: #e7edf8;       /* 面板标题 */
    --text-2: #8a94ac;            /* 次要文字（计数、空态标题、关闭按钮） */
    --text-faint: #7c869e;        /* 弱化文字（cwd） */
    --text-faint-active: #93b4cc; /* 激活行 cwd */
    --text-hint: #565f74;         /* 最弱文字（空态说明） */

    /* 面板卡片 */
    --panel-bg: linear-gradient(180deg, #1b212e 0%, #161b27 100%);
    --panel-border: rgba(140, 170, 235, 0.16);
    --panel-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);

    /* 分隔与徽标 */
    --divider: rgba(255, 255, 255, 0.07);    /* 头部下边框 */
    --pill-bg: rgba(255, 255, 255, 0.06);    /* 计数胶囊底 */
    --pill-border: rgba(255, 255, 255, 0.10);
    --pill-text: #8a94ac;

    /* 关闭按钮 hover */
    --hover-bg: rgba(255, 255, 255, 0.08);
    --hover-color: #eaf0fa;

    /* 会话行 */
    --row-bg: rgba(255, 255, 255, 0.03);
    --row-border: rgba(255, 255, 255, 0.06);
    --row-hover-bg: rgba(255, 255, 255, 0.06);
    --row-hover-border: rgba(255, 255, 255, 0.12);
    --row-active-bg: rgba(87, 214, 255, 0.10);
    --row-active-border: rgba(87, 214, 255, 0.26);

    /* 激活强调条 */
    --accent-bar: linear-gradient(180deg, #6be3ff 0%, #3fa9f5 100%);
    --accent-glow: rgba(87, 214, 255, 0.55);

    /* 状态徽标 */
    --busy: #57d6ff;                       /* 工作中三点 */
    --unread: rgba(255, 90, 110, 0.92);    /* 未读圆点 */
    --unread-glow: rgba(255, 90, 110, 0.60);

    /* 滚动条 */
    --scrollbar-color: rgba(255, 255, 255, 0.16);
    --scrollbar-thumb: rgba(255, 255, 255, 0.14);
    --scrollbar-thumb-hover: rgba(87, 214, 255, 0.45);

    /* 空状态 */
    --empty-border: rgba(255, 255, 255, 0.14);
    --empty-bg: rgba(255, 255, 255, 0.02);
    --empty-icon: #4a5268;
  }

  /* ===== 主题：浅色极简（取色自 .pet/session-panel-b-light-minimal.html） ===== */
  body[data-theme="light-minimal"] {
    --bg: #eef3fa;
    --text-1: #20242e;
    --text-1-active: #2f5bc4;
    --panel-title: #20242e;
    --text-2: #5b6472;
    --text-faint: #98a2b3;
    --text-faint-active: #5b6472;
    --text-hint: #98a2b3;

    --panel-bg: #ffffff;
    --panel-border: rgba(15, 23, 42, 0.07);
    /* 色键透明圆角外侧不能可靠混合桌面，禁用外投影避免角落色带 */
    --panel-shadow: none;

    --divider: #eef1f5;
    --pill-bg: #f2f4f8;
    --pill-border: #eef1f5;
    --pill-text: #5b6472;

    --hover-bg: #e8effc;
    --hover-color: #2f5bc4;

    --row-bg: transparent;
    --row-border: transparent;
    --row-hover-bg: #f5f7fa;
    --row-hover-border: transparent;
    --row-active-bg: #eef4fe;
    --row-active-border: transparent;

    --accent-bar: linear-gradient(180deg, #3b6fe0 0%, #2f5bc4 100%);
    --accent-glow: rgba(59, 111, 224, 0.35);

    --busy: #7c93cc;
    --unread: #e5484d;
    --unread-glow: rgba(229, 72, 77, 0.14);

    --scrollbar-color: #c9d1dd;
    --scrollbar-thumb: #c9d1dd;
    --scrollbar-thumb-hover: #aab6c8;

    --empty-border: rgba(15, 23, 42, 0.12);
    --empty-bg: #f6f8fb;
    --empty-icon: #93a5c1;
  }

  /* ===== 主题：可爱宠物风（取色自 .pet/session-panel-c-cute-pet.html） ===== */
  body[data-theme="cute-pet"] {
    --bg: #fff6e8;
    --text-1: #4c382b;
    --text-1-active: #e56a3c;
    --panel-title: #4c382b;
    --text-2: #8a6a52;
    --text-faint: #c2a48c;
    --text-faint-active: #8a6a52;
    --text-hint: #c2a48c;

    --panel-bg: #fffdf7;
    --panel-border: rgba(196, 140, 88, 0.22);
    /* 同上：只保留卡片本体，不向透明圆角写入阴影像素 */
    --panel-shadow: none;

    --divider: #f6e8d8;
    --pill-bg: #fde9d6;
    --pill-border: #f6d3b4;
    --pill-text: #d96b33;

    --hover-bg: #fde9d6;
    --hover-color: #e56a3c;

    --row-bg: transparent;
    --row-border: transparent;
    --row-hover-bg: #fff5e8;
    --row-hover-border: transparent;
    --row-active-bg: rgba(245, 130, 79, 0.10);
    --row-active-border: transparent;

    --accent-bar: linear-gradient(180deg, #f5824f 0%, #ffb37e 100%);
    --accent-glow: rgba(245, 130, 79, 0.40);

    --busy: #f79a4e;
    --unread: #e6533f;
    --unread-glow: rgba(230, 83, 63, 0.16);

    --scrollbar-color: #e6c9a8;
    --scrollbar-thumb: #e6c9a8;
    --scrollbar-thumb-hover: #d8b28c;

    --empty-border: rgba(196, 140, 88, 0.22);
    --empty-bg: #fff5e8;
    --empty-icon: #d99b5f;
  }

  html, body { height: 100%; background: transparent; }

  body {
    /* 浏览器与 Slate 宿主共同保留透明背景，让面板四个圆角真正透出桌面 */
    background: transparent;
    color: var(--text-1);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* 点击关闭按钮后本地隐藏（无动画）；实际关闭由 C++ 控制，后续推送数据会自动恢复显示 */
  body.is-hidden { display: none; }

  /* ============ 面板卡片（三主题均可切换） ============ */
  .panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
    /* 渐变 / 纯色 / 投影均由主题变量提供，保留各主题的卡片质感 */
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    box-shadow: var(--panel-shadow);
    overflow: hidden;
  }

  .panel-header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 10px 12px 16px;
    border-bottom: 1px solid var(--divider);
  }
  .panel-title { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--panel-title); }
  .panel-count {
    font-size: 11px;
    color: var(--pill-text);
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
  }

  /* 关闭按钮（×）：只向 C++ 发请求，实际关闭由 C++ 控制 */
  .btn-close {
    appearance: none;
    margin-left: auto;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font: inherit;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .btn-close:hover { background: var(--hover-bg); color: var(--hover-color); }
  .btn-close:active { transform: translateY(1px); }

  /* ============ 主体区：列表 / 空态互斥填充 ============ */
  .panel-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ============ 会话列表 ============ */
  .session-list {
    flex: 1;
    min-height: 0;
    /* 自适应视口高度：flex 撑满剩余空间，最多显示 8 行，超出滚动（20px 为上下内边距，底部多留 4px） */
    max-height: calc(var(--row-limit) * var(--row-h) + 20px);
    padding: 8px 8px 12px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-color) transparent;
  }
  /* 内容溢出时底缘渐隐：被裁切的行软溶解而不是硬切在面板下边界（仅溢出时启用，见 renderList） */
  .session-list.can-fade {
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 24px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 24px), transparent 100%);
  }
  /* 自定义滚动条（WebKit） */
  .session-list::-webkit-scrollbar { width: 6px; }
  .session-list::-webkit-scrollbar-track { background: transparent; }
  .session-list::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 3px;
  }
  .session-list::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

  /* 行 */
  .session-row {
    appearance: none;
    font: inherit;
    text-align: left;
    width: 100%;
    height: 56px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px 0 0;
    border-radius: 10px;
    border: 1px solid var(--row-border);
    background: var(--row-bg);
    color: inherit;
    cursor: pointer;
    position: relative;
    transition: background .15s ease, border-color .15s ease;
  }
  .session-row:last-child { margin-bottom: 0; }
  .session-row:hover {
    background: var(--row-hover-bg);
    border-color: var(--row-hover-border);
  }
  .session-row.is-active {
    background: var(--row-active-bg);
    border-color: var(--row-active-border);
  }

  /* 左侧激活强调条 */
  .row-accent {
    align-self: stretch;
    width: 3px;
    margin-left: 0;
    border-radius: 0 3px 3px 0;
    flex: none;
    background: var(--accent-bar);
    box-shadow: 0 0 8px var(--accent-glow);
    opacity: 0;
    transition: opacity .15s ease;
  }
  .session-row.is-active .row-accent { opacity: 1; }

  /* 行主内容 */
  .row-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .row-title {
    font-size: 14px;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .session-row.is-active .row-title { color: var(--text-1-active); font-weight: 600; }
  .row-cwd {
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .session-row.is-active .row-cwd { color: var(--text-faint-active); }

  /* 右侧徽标区 */
  .row-badges { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  /* 工作中：三点跳动（保留原型 A 动效） */
  .badge-working { display: flex; gap: 3px; align-items: center; height: 6px; }
  .badge-working i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--busy);
    animation: dotBounce 1s ease-in-out infinite;
  }
  .badge-working i:nth-child(2) { animation-delay: .15s; }
  .badge-working i:nth-child(3) { animation-delay: .30s; }
  @keyframes dotBounce {
    0%, 100% { transform: translateY(0); opacity: .45; }
    40%      { transform: translateY(-3px); opacity: 1; }
  }

  /* 未读徽标：契约中 unread 是布尔，仅表示「有未读」，用圆点示意（保留原红色 + 光晕语言） */
  .badge-unread {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--unread);
    box-shadow: 0 0 6px var(--unread-glow);
  }

  /* 行入场动画（仅新增单条时使用） */
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .session-row.animate-in { animation: rowIn .28s ease both; }

  /* ============ 空状态 ============ */
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .empty-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 34px 16px;
    border: 1px dashed var(--empty-border);
    border-radius: 10px;
    background: var(--empty-bg);
  }
  .empty-icon { color: var(--empty-icon); width: 44px; height: 44px; }
  .empty-title { font-size: 14px; color: var(--text-2); letter-spacing: 2px; }
  .empty-sub { font-size: 12px; color: var(--text-hint); }

  [hidden] { display: none !important; }

  /* 动效尊重系统设置 */
  @media (prefers-reduced-motion: reduce) {
    .badge-working i, .session-row.animate-in { animation: none !important; }
  }
</style>
</head>
<body>

  <!-- 面板本体：尺寸跟随窗口视口 -->
  <section class="panel" id="panel" aria-label="会话列表面板">
    <header class="panel-header">
      <span class="panel-title">会话</span>
      <span class="panel-count" id="panelCount">0</span>
      <button class="btn-close" id="btnClose" type="button" aria-label="关闭面板" title="关闭面板">×</button>
    </header>

    <div class="panel-body">
      <!-- 会话列表（初始为空，真实数据由 C++ 通过 KPetPanel API 推入） -->
      <div class="session-list" id="sessionList" role="listbox" aria-label="会话列表"></div>

      <!-- 空状态（列表为空时自动显示） -->
      <div class="empty-state" id="emptyState">
        <div class="empty-inner">
          <svg class="empty-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 15h28v16H22l-9 7v-7h-3z"/>
            <circle cx="19" cy="23" r="1.4" fill="currentColor" stroke="none"/>
            <circle cx="24" cy="23" r="1.4" fill="currentColor" stroke="none"/>
            <circle cx="29" cy="23" r="1.4" fill="currentColor" stroke="none"/>
          </svg>
          <p class="empty-title">暂无会话</p>
          <p class="empty-sub">新建或唤醒的会话会出现在这里</p>
        </div>
      </div>
    </div>
  </section>

<script>
'use strict';

/* ================================================================
 * 会话面板脚本（供 UE5 WebBrowser LoadString 加载）
 *
 * 对外契约：window.KPetPanel
 *   applySnapshot(items)            全量替换列表（items 为数组）
 *   addOrUpdate(item)               新增或原位更新一条
 *   removeSession(sessionId)        删除一条
 *   setActive(sessionId, bool)      设置目标会话的激活态
 *   updateState(sessionId, state)   局部更新 { working, unread }
 *   setTheme(themeId)               切换主题（body[data-theme] 即时生效）
 *   setFpsMonitor(enabled)          启停 FPS 上报
 *   refreshSurface()                恢复显示后强制完整重绘透明表面
 *
 * 条目形状：{ sessionId, title, cwd, active, working, unread }
 * 全部方法幂等、防 undefined：C++ 可能在页面任意时机注入调用。
 * ================================================================ */

/* ---------- 元素引用 ---------- */
const listEl   = document.getElementById('sessionList');
const countEl  = document.getElementById('panelCount');
const emptyEl  = document.getElementById('emptyState');
const btnClose = document.getElementById('btnClose');

/* ---------- 数据存储：Map 以 sessionId 为键，保持插入顺序 ---------- */
const sessions = new Map();

/* ---------- 主题清单：与设置页共用同一套 themeId ---------- */
const THEME_IDS = ['dark-glass', 'light-minimal', 'cute-pet'];

/* ---------- 透明表面完整刷新 ---------- */
/* UE WebBrowser 的软件纹理首次可能只上传局部脏区。恢复显示时短暂改变整页透明度，
 * 让 CEF 连续提交两次完整页面绘制，覆盖未初始化像素与隐藏前残留。宿主会在预热期
 * 保持整窗透明，因此这个极小的透明度变化不会被用户看到。 */
let surfaceRefreshToken = 0;
function refreshSurface() {
  const token = ++surfaceRefreshToken;
  const root = document.documentElement;
  root.style.opacity = '';
  void root.offsetWidth;
  requestAnimationFrame(() => {
    if (token !== surfaceRefreshToken) return;
    root.style.opacity = '0.999';
    void root.offsetWidth;
    requestAnimationFrame(() => {
      if (token !== surfaceRefreshToken) return;
      root.style.opacity = '';
    });
  });
}

/* ---------- 工具函数 ---------- */
function truncatePath(p, maxLen) {
  maxLen = maxLen || 30;
  if (p.length <= maxLen) return p;
  const half = Math.floor((maxLen - 3) / 2);
  return p.slice(0, half) + '…' + p.slice(p.length - (maxLen - 2 - half));
}

/* 兜底标题：title 为空时取 cwd 末段，cwd 也为空时取 sessionId 前 8 位 */
function fallbackTitle(sessionId, cwd) {
  const seg = cwd.replace(/[\\/]+$/, '').split(/[\\/]/).pop();
  if (seg) return seg;
  const short = String(sessionId).slice(0, 8);
  return short || '(未命名会话)';
}

/* 规范化条目：字段缺失/类型异常时补默认值；无 sessionId 的条目忽略并告警 */
function normalize(item) {
  if (!item || typeof item !== 'object' || Array.isArray(item)) {
    console.warn('[KPetPanel] 忽略非法会话条目：', item);
    return null;
  }
  const sessionId = item.sessionId == null ? '' : String(item.sessionId);
  if (!sessionId) {
    console.warn('[KPetPanel] 会话条目缺少 sessionId，已忽略：', item);
    return null;
  }
  const cwd = item.cwd == null ? '' : String(item.cwd);
  let title = item.title == null ? '' : String(item.title);
  if (!title.trim()) title = fallbackTitle(sessionId, cwd);
  return {
    sessionId: sessionId,
    title: title,
    cwd: cwd,
    active: !!item.active,
    // working 是 active 会话的子状态：快照异常或消息乱序也不能让历史会话呈现为
    // 「灰色但仍在工作」的矛盾状态。
    working: !!(item.active && item.working),
    unread: !!item.unread
  };
}

/* ---------- UE 桥调用 ---------- */
/* 探测 window.ue.petbridge；桥方法按大小写不敏感方式查找（SelectSession 可能暴露为
 * selectsession，ClosePanel 同理）；UE 绑定返回值是 Promise，无需 await；
 * 桥不存在或方法缺失时仅告警、页面不崩（便于纯浏览器调试）。 */
function findBridgeMethod(bridge, name) {
  if (!bridge || typeof name !== 'string') return undefined;
  if (typeof bridge[name] === 'function') return bridge[name];
  const lower = name.toLowerCase();
  for (const key of Object.keys(bridge)) {
    if (key.toLowerCase() === lower && typeof bridge[key] === 'function') {
      return bridge[key];
    }
  }
  return undefined;
}

function callBridge(action, ...args) {
  try {
    const host = (typeof window !== 'undefined') ? window : undefined;
    const bridge = host && host.ue && host.ue.petbridge ? host.ue.petbridge : undefined;
    if (!bridge) {
      console.warn('[KPetPanel] UE 桥（window.ue.petbridge）不存在，忽略动作：' + action + '，参数：', args);
      return;
    }
    const fn = findBridgeMethod(bridge, action);
    if (typeof fn === 'function') {
      fn.apply(bridge, args);
    } else {
      console.warn('[KPetPanel] UE 桥未暴露方法：' + action);
    }
  } catch (err) {
    console.warn('[KPetPanel] 调用 UE 桥失败：', err);
  }
}

/* ---------- FPS 上报器 ---------- */
/* 与 settings.html 是同一段轻量脚本（各页内联一份）：requestAnimationFrame 计数，
 * 每满 1 秒经本页桥上报一次整数 fps；页面加载后不自动启动，等 C++ 通知。 */
window.KPetFps = (function () {
  let running = false;
  let rafId = 0;
  let frames = 0;
  let baseTs = 0;

  function tick(now) {
    frames++;
    const elapsed = (now - baseTs) / 1000;
    if (elapsed >= 1) {
      callBridge('ReportFps', Math.round(frames / elapsed));
      frames = 0;
      baseTs = now;
    }
    if (running) rafId = requestAnimationFrame(tick);
  }

  return {
    start() {
      if (running) return;
      running = true;
      frames = 0;
      baseTs = performance.now();
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      frames = 0;
      baseTs = 0;
    }
  };
})();

/* ---------- 渲染 ---------- */
function makeRow(item) {
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'session-row' + (item.active ? ' is-active' : '');
  row.dataset.sessionId = item.sessionId;
  row.setAttribute('role', 'option');
  row.setAttribute('aria-selected', item.active ? 'true' : 'false');

  const accent = document.createElement('span');
  accent.className = 'row-accent';

  const main = document.createElement('span');
  main.className = 'row-main';
  const title = document.createElement('span');
  title.className = 'row-title';
  title.textContent = item.title;
  const cwd = document.createElement('span');
  cwd.className = 'row-cwd';
  cwd.textContent = truncatePath(item.cwd);
  cwd.title = item.cwd;
  main.append(title, cwd);

  const badges = document.createElement('span');
  badges.className = 'row-badges';
  if (item.working) {
    const w = document.createElement('span');
    w.className = 'badge-working';
    w.setAttribute('aria-label', '工作中');
    w.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
    badges.appendChild(w);
  }
  if (item.unread) {
    const u = document.createElement('span');
    u.className = 'badge-unread';
    u.setAttribute('aria-label', '有未读消息');
    u.setAttribute('title', '有未读消息');
    badges.appendChild(u);
  }

  row.append(accent, main, badges);
  return row;
}

function renderList(animateSessionId) {
  listEl.textContent = '';
  let index = 0;
  sessions.forEach((item) => {
    const row = makeRow(item);
    if (animateSessionId && item.sessionId === animateSessionId) {
      row.classList.add('animate-in');
      row.style.animationDelay = (index * 28) + 'ms';
    }
    listEl.appendChild(row);
    index++;
  });
  updateCount();
  syncEmptyState();
  /* 内容超出可视高度才启用底缘渐隐，行数少时保持干净利落 */
  listEl.classList.toggle('can-fade', listEl.scrollHeight > listEl.clientHeight + 1);
}

function updateCount() {
  countEl.textContent = String(sessions.size);
}

/* 列表为空时自动切换空态视图 */
function syncEmptyState() {
  const empty = sessions.size === 0;
  listEl.hidden = empty;
  emptyEl.hidden = !empty;
}

/* ---------- 面板显隐 ---------- */
/* 点击关闭只做本地隐藏（无动画）+ 发请求，实际关闭由 C++ 控制；
 * 之后若有数据 API 调用则自动恢复显示，避免窗口未真正关闭时面板「失联」。 */
function showPanel() {
  document.body.classList.remove('is-hidden');
}

/* ---------- 行点击：选中会话 ---------- */
/* 点击仅乐观清除目标未读，不改宿主维护的会话激活态。 */
function selectSession(item) {
  item.unread = false;
  renderList();
  callBridge('SelectSession', item.sessionId);
}

/* 列表容器上做事件委托，避免反复重绘导致重复绑定 */
listEl.addEventListener('click', (ev) => {
  const row = ev.target.closest('.session-row');
  if (!row || !row.dataset || !row.dataset.sessionId) return;
  const item = sessions.get(row.dataset.sessionId);
  if (item) selectSession(item);
});

btnClose.addEventListener('click', () => {
  document.body.classList.add('is-hidden');
  callBridge('ClosePanel');
});

/* ---------- 对外 API ---------- */
window.KPetPanel = {

  /* 全量替换列表；非数组入参按空列表处理并告警（幂等） */
  applySnapshot(items) {
    if (!Array.isArray(items)) {
      console.warn('[KPetPanel] applySnapshot 期望数组入参，实际为：', items);
      items = [];
    }
    sessions.clear();
    items.forEach((raw) => {
      const item = normalize(raw);
      if (item) sessions.set(item.sessionId, item);
    });
    renderList();
    showPanel();
  },

  /* 新增或原位更新一条（新增行带入场动画；幂等） */
  addOrUpdate(raw) {
    const item = normalize(raw);
    if (!item) return;
    const isNew = !sessions.has(item.sessionId);
    sessions.set(item.sessionId, item);
    renderList(isNew ? item.sessionId : undefined);
    showPanel();
  },

  /* 删除一条；sessionId 缺失时静默忽略（幂等） */
  removeSession(sessionId) {
    if (sessionId == null) return;
    sessions.delete(String(sessionId));
    renderList();
    showPanel();
  },

  /* 设置激活态：仅更新目标；结束目标会话时同时结束其工作态（幂等）。 */
  setActive(sessionId, active) {
    if (sessionId == null) return;
    const key = String(sessionId);
    const target = sessions.get(key);
    if (!target) return;
    target.active = !!active;
    if (!target.active) target.working = false;
    renderList();
    showPanel();
  },

  /* 局部更新工作/未读状态；state 缺失或字段非布尔时不改（幂等） */
  updateState(sessionId, state) {
    if (sessionId == null) return;
    const target = sessions.get(String(sessionId));
    if (!target || !state || typeof state !== 'object') return;
    if (typeof state.working === 'boolean') target.working = target.active && state.working;
    if (typeof state.unread === 'boolean') target.unread = state.unread;
    renderList();
    showPanel();
  },

  /* 切换主题：themeId ∈ 三主题，写入 body[data-theme] 即时生效；非法值忽略并告警 */
  setTheme(themeId) {
    if (THEME_IDS.indexOf(themeId) === -1) {
      console.warn('[KPetPanel] 未知主题，忽略：', themeId);
      return;
    }
    document.body.dataset.theme = themeId;
  },

  /* 启停 FPS 上报（由 C++ 通过 applySettings / setFpsMonitor 通知） */
  setFpsMonitor(enabled) {
    if (enabled) {
      window.KPetFps.start();
    } else {
      window.KPetFps.stop();
    }
  },

  /* 面板从隐藏态恢复后调用；requestAnimationFrame 在 CEF 隐藏期间会自然等待 */
  refreshSurface() {
    refreshSurface();
  }
};

/* ---------- 首次渲染（初始为空列表 → 空态） ---------- */
renderList();
</script>
</body>
</html>
