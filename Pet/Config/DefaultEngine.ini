; -----------------------------------------------------------------------
; r.D3D11.UseAllowTearing 必须在 RHI 初始化前生效（blit 交换链，保证弹窗 Host 的
; 黑色色键 LWA_COLORKEY 能被 DWM 合成、两个 WebUI 面板透明圆角不显示黑框）。
; 该 CVar 是 ECVF_ReadOnly，且在首个 FD3D11Viewport 构造时被锁存进静态变量
; （引擎 WindowsD3D11Viewport.cpp），运行时 CVar->Set() 无效（死代码）。
; 只有写进 [SystemSettings]：GSystemSettings.Initialize 早于 RHIInit，经
; deferred-dummy 接管机制在 RHI 初始化前落地生效。运行时两个 WebUI 面板只回读校验并记日志。
; -----------------------------------------------------------------------
[SystemSettings]
